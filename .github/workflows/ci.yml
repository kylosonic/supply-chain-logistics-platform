name: CI

# these gates are the release gate. A red run must block the
# Vercel deploy for the affected project — wire that with the Vercel "Ignored
# Build Step" / deployment-check setting documented in docs/release-gates.md.
# This workflow deliberately runs the SAME commands a release depends on: full
# backend tests, console tests + typecheck + lint + production build, site tests
# + bundle-weight budget + production build, plus dependency vulnerability
# scans for every language in the monorepo.

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: backend-tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/platform-api
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies (lockfile, hash-verified)
        run: |
          python -m pip install --upgrade pip
          # the committed lockfile is authoritative for deployments, so
          # CI installs exactly what Docker installs.
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip install pytest pytest-timeout pytest-xdist ruff

      - name: Run backend tests
        run: pytest -q --timeout=120 --timeout-method=thread -n 4

      - name: Lint backend (ruff correctness gate)
        # The legacy tree still carries formatting/unused-import debt. This
        # gate blocks undefined names and syntax errors; formatting cleanup is
        # tracked separately so it cannot mask a runtime failure.
        run: ruff check app --select E9,F63,F7,F82

  backend-dependency-audit:
    name: backend-dependency-audit
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/platform-api
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Audit locked Python dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.lock --strict --progress-spinner off

  ops-console:
    name: ops-console
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/ops-console/package-lock.json

      - name: Install ops console dependencies
        run: npm --prefix apps/ops-console ci

      - name: Typecheck ops console
        run: npm --prefix apps/ops-console run typecheck

      - name: Lint ops console
        run: npm --prefix apps/ops-console run lint

      - name: Run ops console tests
        run: npm --prefix apps/ops-console run test

      - name: Build ops console
        run: npm --prefix apps/ops-console run build

      - name: Audit ops console dependencies (deployed set)
        # Audit dependencies that ship to users. Development-only advisories
        # are reported by the non-blocking step below.
        run: npm --prefix apps/ops-console audit --omit=dev --audit-level=high

      - name: Report dev-only advisories (non-blocking)
        run: npm --prefix apps/ops-console audit || true

  product-web:
    name: product-web
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/product-web/package-lock.json

      - name: Install product web dependencies
        run: npm --prefix apps/product-web ci

      - name: Run product web tests
        run: npm --prefix apps/product-web run test

      - name: Build product web
        run: npm --prefix apps/product-web run build

      - name: Check page-weight budget
        run: npm --prefix apps/product-web run check:bundle

      - name: Audit product web dependencies (deployed set)
        run: npm --prefix apps/product-web audit --omit=dev --audit-level=high

      - name: Report dev-only advisories (non-blocking)
        run: npm --prefix apps/product-web audit || true

  desktop:
    name: desktop
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install desktop dependencies
        run: npm --prefix apps/desktop ci

      - name: Test desktop archive handling
        run: npm --prefix apps/desktop run test

      - name: Verify Electron runtime
        run: npm --prefix apps/desktop run doctor

      - name: Audit desktop dependencies
        run: npm --prefix apps/desktop audit --audit-level=high
